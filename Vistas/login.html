<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>CLUB ADSO</title>
        <link rel="stylesheet" href="../Assets/css/estilos.css">

    </head>
    <body>
        <div>
            <h2>Inicio Sesión Asociados-Acerias</h2>
            <form id="formLogin" action="../Modelos/iniciarSesion.php" method="POST">
                <div class="grupo-input">
                    <label>Correo electrónico: </label>
                    <input type="email" id="email" name="email" required placeholder="ejemplo: camila@gmail.com">
                </div>
                <div class="grupo-input">
                    <label>Contraseña: </label>
                    <input type="password" id="contraseña" name="contraseña" required placeholder="ejemplo: 1245">
                </div>
                <div class="grupo-botones">
                    <button type="submit">Iniciar Sesion</button>
                </div>
                <div class="registro">
                    <p>¿No tienes una cuenta?
                        <a href="registro.html"> Regístrate aquí</a></p>
                </div>
                <p id="mensajeLogin" class="text-danger mt-3 mb-0" role="alert"></p>
            </form>
        </div>
    </body>
    <script src="../Controladores/login.js"></script>
</html>
